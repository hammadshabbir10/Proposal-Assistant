display_information:
  name: Proposal Assistant
features:
  bot_user:
    display_name: Proposal Assistant
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:read
      - files:write
      - im:history
      - im:read
      - app_mentions:read
      - channels:history
      - reactions:write   # optional: lets the bot add 👀 to an upload; the bot works without it
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
      - file_shared
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
